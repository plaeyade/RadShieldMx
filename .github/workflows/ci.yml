# CI/CD Pipeline — RadShield-MX v64
# GitHub Actions with 8GB RAM enables full build optimization
# (vs sandbox with ~2.8GB which requires OOM-safe mode)

name: RadShield-MX CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # CI=true triggers optimized build (esbuild minify + chunk splitting)
  CI: true
  # 6GB heap for Node.js (8GB runner - 2GB for OS and other processes)
  NODE_OPTIONS: "--max-old-space-size=6144"

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deployable stability check
        run: npm run check

      - name: ESLint (trinquete contra .eslint-baseline.json)
        run: npm run lint:ci

  test:
    name: Vitest Tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest tests
        run: npx vitest run --reporter=verbose

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for production (CI mode)
        # Fase 9: el artefacto `dist` es el que publica el job `deploy` en GitHub Pages
        # (https://<usuario>.github.io/RadShieldMx/), así que se construye con esa base.
        env:
          VITE_BASE_PATH: /RadShieldMx/
        run: npm run build

      - name: Verify GitHub Pages base path
        run: node scripts/verificar-base-pages.mjs dist /RadShieldMx/

      # Fase 10: el sitio publicado dice de qué commit sale (https://<usuario>.github.io/RadShieldMx/version.json).
      - name: Stamp deployed commit
        run: printf '{"commit":"%s","ref":"%s","run":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" > dist/version.json

      - name: Report bundle size
        run: |
          echo "=== Bundle Size Report ==="
          du -sh dist/
          echo "---"
          ls -lh dist/assets/
          echo "---"
          echo "Total JS size:"
          du -ch dist/assets/*.js | tail -1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

      - name: Upload bundle stats
        uses: actions/upload-artifact@v4
        with:
          name: bundle-stats
          path: dist/assets/
          retention-days: 7

  arranque-pages:
    name: Arranque en Pages (datos y SW de la versión anterior)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Bloqueante: estado vacío y «Guíame» visible a 1366×768 y 1280×720, también con autoguardado/SW antiguos.
      - name: Pages startup e2e (Playwright, Chrome)
        env:
          VITE_BASE_PATH: /RadShieldMx/
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4174/RadShieldMx/
        run: npx playwright test e2e/fase10-pages-arranque.spec.ts --project=chromium

  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run E2E tests
        run: npx playwright test
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  humo:
    name: Humo (cálculo de referencia en el build de Pages)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Bloqueante: carga la app servida en /RadShieldMx/ y comprueba el ejemplo «Guíame» (18.9 mm Pb).
      - name: Smoke test (Playwright, Chrome)
        env:
          VITE_BASE_PATH: /RadShieldMx/
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4174/RadShieldMx/
        run: npx playwright test e2e/humo-calculo-referencia.spec.ts --project=chromium

      - name: Upload smoke report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: humo-report
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build, humo]
    # Repo público (autorizado por el propietario el 2026-11-09): publica en cada push a main.
    # Para pausar el despliegue sin tocar el workflow: variable de repositorio PAGES_HABILITADO=false.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_HABILITADO != 'false'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Fase 10: un despliegue a la vez. El 2026-11-10 el run de 9f90d8a terminó después que el de 23eb3d2 y Pages quedó
    # en el commit anterior; además se publica sólo si este commit sigue siendo la punta de main.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Check this commit is still the tip of main
        id: punta
        run: |
          punta=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
          echo "main=$punta run=$GITHUB_SHA"
          if [ "$punta" = "$GITHUB_SHA" ]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main ya avanzó a $punta; no se publica $GITHUB_SHA (lo publicará el run de la punta)."
          fi

      - name: Download build artifacts
        if: steps.punta.outputs.publicar == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Setup Pages
        if: steps.punta.outputs.publicar == 'true'
        uses: actions/configure-pages@v5

      - name: Upload to GitHub Pages
        if: steps.punta.outputs.publicar == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: steps.punta.outputs.publicar == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
