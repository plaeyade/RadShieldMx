# CI/CD Pipeline — RadShield-MX v64
# GitHub Actions with 8GB RAM enables full build optimization
# (vs sandbox with ~2.8GB which requires OOM-safe mode)

name: RadShield-MX CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # CI=true triggers optimized build (esbuild minify + chunk splitting)
  CI: true
  # 6GB heap for Node.js (8GB runner - 2GB for OS and other processes)
  NODE_OPTIONS: "--max-old-space-size=6144"

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deployable stability check
        run: npm run check

      - name: ESLint (trinquete contra .eslint-baseline.json)
        run: npm run lint:ci

  test:
    name: Vitest Tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest tests
        run: npx vitest run --reporter=verbose

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for production (CI mode)
        run: npm run build

      - name: Report bundle size
        run: |
          echo "=== Bundle Size Report ==="
          du -sh dist/
          echo "---"
          ls -lh dist/assets/
          echo "---"
          echo "Total JS size:"
          du -ch dist/assets/*.js | tail -1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

      - name: Upload bundle stats
        uses: actions/upload-artifact@v4
        with:
          name: bundle-stats
          path: dist/assets/
          retention-days: 7

  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run E2E tests
        run: npx playwright test
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    # Repo privado: Pages sólo cuando se vuelva público (variable de repositorio PAGES_HABILITADO=true).
    if: github.ref == 'refs/heads/main' && vars.PAGES_HABILITADO == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
