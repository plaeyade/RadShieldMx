# RadShield-MX local/test database only.
#
# Use this compose file for Fase 32B-run before enabling the frontend backend
# bridge. It intentionally starts only MySQL; migrations and seed are executed
# explicitly from the host with DATABASE_URL.

services:
  db:
    image: mysql:8.0
    container_name: radshield-mx-db-test
    environment:
      # Credenciales de prueba desde .env (copie .env.example y ponga valores propios; nunca se versionan).
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD en .env (vea .env.example)}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-radshield_mx_test}
      MYSQL_USER: ${MYSQL_USER:?Defina MYSQL_USER en .env (vea .env.example)}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD en .env (vea .env.example)}
    ports:
      # Sólo en la interfaz local: la base de prueba no queda expuesta a la red.
      - "127.0.0.1:3306:3306"
    volumes:
      - radshield-mx-db-test:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  radshield-mx-db-test:
