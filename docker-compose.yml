# RadShield-MX full local stack.
#
# The frontend can run without DB. The API depends on MySQL and should be used
# only after running migrations/seed against this local/test database.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    networks:
      - radshield-net

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # Mismas credenciales que el servicio db (si la contraseña tiene caracteres especiales, codifíquela para URL).
      DATABASE_URL: mysql://${MYSQL_USER:?Defina MYSQL_USER en .env}:${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD en .env}@db:3306/${MYSQL_DATABASE:-radshield_mx_test}
      APP_ID: ${APP_ID:-}
      APP_SECRET: ${APP_SECRET:-}
      KIMI_AUTH_URL: ${KIMI_AUTH_URL:-}
      KIMI_OPEN_URL: ${KIMI_OPEN_URL:-}
      OWNER_UNION_ID: ${OWNER_UNION_ID:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - radshield-net

  db:
    image: mysql:8.0
    environment:
      # Credenciales de prueba desde .env (copie .env.example y ponga valores propios; nunca se versionan).
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD en .env (vea .env.example)}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-radshield_mx_test}
      MYSQL_USER: ${MYSQL_USER:?Defina MYSQL_USER en .env (vea .env.example)}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD en .env (vea .env.example)}
    ports:
      # Sólo en la interfaz local: la base de prueba no queda expuesta a la red.
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - radshield-net

volumes:
  mysql-data:

networks:
  radshield-net:
    driver: bridge
